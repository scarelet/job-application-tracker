name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker_user
          POSTGRES_PASSWORD: tracker_pass
          POSTGRES_DB: tracker_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker_user -d tracker_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check app imports cleanly
        env:
          DATABASE_URL: postgresql://tracker_user:tracker_pass@localhost:5432/tracker_db
        run: python -c "import app"

      - name: Build Docker image
        run: docker build -t job-tracker:ci .